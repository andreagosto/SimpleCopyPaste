<?xml version="1.0" encoding="UTF-8"?>
<svg height="16px" viewBox="0 0 16 16" width="16px" xmlns="http://www.w3.org/2000/svg">
  <!--
    SimpleClips panel mark, symbolic.

    Scissors as a solid silhouette: two legs crossing at the pivot, each
    a ring below and a blade tapering to a point above. Sized to fill the
    16x16 grid so it stays readable at the small size the top bar draws.
    The single ink colour is replaced by the shell with the theme
    foreground, so the mark follows a light or dark bar.

    This comment sits inside the root element on purpose: gdk-pixbuf
    sniffs the opening bytes to pick a loader, and text before "<svg"
    pushes the match out of its window, making the icon fail to load.
  -->
  <path fill="#2e3436" d="M 3.91 9.96 L 7.07 6.02 L 7.22 5.83 L 13.65 0.85 L 8.78 7.37 L 8.93 7.18 L 6.80 11.76 ZM 0.90 12.55 a 3.05 3.05 0 1 1 6.10 0 a 3.05 3.05 0 1 1 -6.10 0 ZM 2.20 12.55 a 1.75 1.75 0 1 0 3.50 0 a 1.75 1.75 0 1 0 -3.50 0 Z"/>
  <path fill="#2e3436" d="M 9.20 11.76 L 7.07 7.18 L 7.22 7.37 L 2.35 0.85 L 8.78 5.83 L 8.93 6.02 L 12.09 9.96 ZM 9.00 12.55 a 3.05 3.05 0 1 1 6.10 0 a 3.05 3.05 0 1 1 -6.10 0 ZM 10.30 12.55 a 1.75 1.75 0 1 0 3.50 0 a 1.75 1.75 0 1 0 -3.50 0 Z"/>
</svg>
